<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Planning — Pause Pilates</title>
    <meta name="description" content="Le planning de la semaine chez Pause Pilates, en un coup d'œil." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="assets/img/logo.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#00495e" />
    <link rel="apple-touch-icon" href="assets/img/icon-apple-touch.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pause Pilates" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="has-tab-bar">
    <header class="app-header-slim">
      <img src="assets/img/logo.png" alt="" />
      <span>Planning</span>
    </header>

    <main class="week-screen">
      <div class="schedule-filters reveal-on-load">
        <button class="filter-chip is-active" data-filter="all">Tous les cours</button>
        <button class="filter-chip" data-filter="pilates,pilates-inter">Pilates</button>
        <button class="filter-chip" data-filter="abdos">Abdos de Gasquet</button>
        <button class="filter-chip" data-filter="yoga">Yoga</button>
        <button class="filter-chip" data-filter="cardio">Cardio renfo</button>
      </div>

      <section class="week-glance reveal-on-load" style="--reveal-delay: 0.06s;">
        <div class="week-grid">
          <div class="week-day">
            <span class="week-day__label">Lun</span>
            <button class="week-slot" data-type="pilates" data-day="Lundi" data-time="10h30 – 11h30" data-name="Pilates" data-level="Tous niveaux">10h30</button>
            <button class="week-slot" data-type="pilates" data-day="Lundi" data-time="12h30 – 13h30" data-name="Pilates" data-level="Tous niveaux">12h30</button>
            <button class="week-slot" data-type="yoga" data-day="Lundi" data-time="19h00 – 20h30" data-name="Yin Yoga" data-level="">19h00</button>
          </div>
          <div class="week-day">
            <span class="week-day__label">Mar</span>
            <button class="week-slot" data-type="pilates-inter" data-day="Mardi" data-time="19h00 – 20h00" data-name="Pilates" data-level="Intermédiaire">19h00</button>
          </div>
          <div class="week-day">
            <span class="week-day__label">Mer</span>
            <button class="week-slot" data-type="abdos" data-day="Mercredi" data-time="09h00 – 10h00" data-name="Abdos de Gasquet" data-level="">09h00</button>
            <button class="week-slot" data-type="pilates" data-day="Mercredi" data-time="10h15 – 11h15" data-name="Pilates" data-level="Tous niveaux">10h15</button>
          </div>
          <div class="week-day">
            <span class="week-day__label">Jeu</span>
            <button class="week-slot" data-type="yoga" data-day="Jeudi" data-time="09h30 – 10h30" data-name="Yoga" data-level="">09h30</button>
            <button class="week-slot" data-type="pilates" data-day="Jeudi" data-time="18h00 – 19h00" data-name="Pilates" data-level="">18h00</button>
          </div>
          <div class="week-day">
            <span class="week-day__label">Ven</span>
            <button class="week-slot" data-type="pilates" data-day="Vendredi" data-time="10h15 – 11h15" data-name="Pilates" data-level="Tous niveaux">10h15</button>
          </div>
          <div class="week-day">
            <span class="week-day__label">Sam</span>
            <button class="week-slot" data-type="cardio" data-day="Samedi" data-time="10h00 – 11h00" data-name="Cardio renfo" data-level="Tous niveaux">10h00</button>
          </div>
        </div>
      </section>

      <div class="week-detail reveal-on-load" id="week-detail" style="--reveal-delay: 0.12s;">
        <p class="week-detail__empty">Touchez un créneau pour voir le détail.</p>
      </div>
    </main>

    <nav class="tab-bar" aria-label="Navigation">
      <a href="index.html" class="tab-bar__item" data-match="index.html,">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>

      <a href="reservation.html" class="tab-bar__item tab-bar__item--cta" data-match="reservation.html">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M9 16l2 2 4-4"/></svg>
        </span>
        <span>Réserver</span>
      </a>
      <a href="infos.html" class="tab-bar__item" data-match="infos.html,about.html,lepilates.html,services.html,tarifs.html,faq.html,emploi.html,contact.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
        <span>Infos</span>
      </a>
    </nav>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/capacitor-bridge.js"></script>
    <script src="assets/js/week-planning.js"></script>
  </body>
</html>
