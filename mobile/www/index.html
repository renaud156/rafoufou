<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pause Pilates</title>
    <meta name="description" content="Réservez votre cours de Pilates ou de Yoga chez Pause Pilates, à Colmar." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="assets/img/logo.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#00495e" />
    <link rel="apple-touch-icon" href="assets/img/icon-apple-touch.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pause Pilates" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="has-tab-bar">
    <div id="app-loader" aria-hidden="true">
      <div class="loader-stars"></div>
      <div class="loader-rings">
        <span class="loader-ring--outer"></span>
        <div id="app-loader__badge">
          <img src="assets/img/logo.png" alt="" />
        </div>
      </div>
      <span class="loader-dot"></span>
      <div class="loader-progress"><div class="loader-progress__fill"></div></div>
      <p class="loader-status">Équilibre · Respiration · Renforcement</p>
    </div>

    <main>
      <div class="home-hero">
        <img class="home-hero__photo" src="assets/img/studio-balls-wide.jpg" alt="L'espace Pilates du studio Pause Pilates, à Colmar" loading="eager" />
        <div class="home-hero__scrim"></div>
        <div class="home-hero__brand">
          <img class="home-hero__logo" src="assets/img/logo.png" alt="" />
          <span>
            <span class="home-hero__name">Pause Pilates</span>
            <span class="home-hero__sub">Studio Pilates · Colmar</span>
          </span>
        </div>
        <a class="home-hero__call" href="tel:+33967043844" aria-label="Appeler le studio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </a>
      </div>

      <div class="home-greeting reveal-on-load">
        <h1>Bonjour !</h1>
        <p>Prêt·e pour votre séance ?</p>
      </div>

      <div class="home-tiles reveal-on-load" style="--reveal-delay: 0.05s;">
        <a class="home-tile home-tile--primary" href="#schedule">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M9 16l2 2 4-4"/></svg>
          <span>Réserver</span>
        </a>
        <a class="home-tile" href="cours.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Cours</span>
        </a>
        <a class="home-tile" href="infos.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 12.3L12.7 20.2a2 2 0 0 1-2.8 0l-7-7a2 2 0 0 1 0-2.8l7.9-7.9a2 2 0 0 1 1.5-.6l6 .1a2 2 0 0 1 2 2l.1 6a2 2 0 0 1-.6 1.5z"/><circle cx="14" cy="7" r="1.2"/></svg>
          <span>Tarifs</span>
        </a>
      </div>

      <div class="next-class-section reveal-on-load" style="--reveal-delay: 0.1s;">
        <h2>Prochain cours</h2>
        <a id="next-class-card" class="next-class-card" href="detail.html">
          <img class="next-class-card__photo" src="assets/img/studio-reformer.jpg" alt="" />
          <span class="next-class-card__body">
            <strong class="next-class__name"></strong>
            <span class="next-class__meta"></span>
          </span>
          <span class="next-class-card__chev">›</span>
        </a>
      </div>

      <section class="schedule-section reveal-on-load" id="schedule" style="--reveal-delay: 0.14s;">
        <div class="schedule-section__head">
          <div>
            <h2>Planning des cours</h2>
            <p id="week-range-label"></p>
          </div>
          <div class="week-nav">
            <button id="week-prev" aria-label="Semaine précédente">‹</button>
            <span>Cette semaine</span>
            <button id="week-next" aria-label="Semaine suivante">›</button>
          </div>
        </div>

        <div class="day-strip" id="day-strip"></div>

        <div class="schedule-filters" style="margin: 1.1rem 0 1rem;">
          <button class="filter-chip is-active" data-filter="all">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            Tous
          </button>
          <button class="filter-chip" data-filter="pilates,pilates-inter">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/></svg>
            Pilates
          </button>
          <button class="filter-chip" data-filter="abdos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8c2.5-2 5 2 7.5 0S14 6 16.5 8s5-2 5.5 0"/><path d="M2 14c2.5-2 5 2 7.5 0s4.5-2 7 0 5-2 5.5 0"/></svg>
            Abdos
          </button>
          <button class="filter-chip" data-filter="yoga">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="18" r="1.6"/><path d="M12 16c0-4.5-3.5-6-3.5-9.5a3.5 3.5 0 0 1 7 0c0 3.5-3.5 5-3.5 9.5z"/><path d="M8.3 13c-3-1.3-4.8-4.2-4-7.3"/><path d="M15.7 13c3-1.3 4.8-4.2 4-7.3"/></svg>
            Yoga
          </button>
          <button class="filter-chip" data-filter="cardio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12h4l2-7 4 14 2-7h7"/></svg>
            Cardio
          </button>
        </div>

        <div class="slot-list" id="slot-list"></div>
      </section>
    </main>

    <nav class="tab-bar" aria-label="Navigation">
      <a href="index.html" class="tab-bar__item" data-match="index.html,">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
        <span>Accueil</span>
      </a>
      <a href="cours.html" class="tab-bar__item" data-match="cours.html,detail.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Cours</span>
      </a>
      <a href="infos.html" class="tab-bar__item" data-match="infos.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.5" r="0.8" fill="currentColor" stroke="none"/></svg>
        <span>Infos</span>
      </a>
    </nav>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/capacitor-bridge.js"></script>
    <script src="assets/js/schedule.js"></script>
    <script src="assets/js/home-schedule.js"></script>
  </body>
</html>
