<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Détails du cours — Pause Pilates</title>
    <meta name="description" content="Détails et réservation d'un cours chez Pause Pilates." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="assets/img/logo.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#00495e" />
    <link rel="apple-touch-icon" href="assets/img/icon-apple-touch.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pause Pilates" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="tool-topbar">
      <a class="tool-back" href="planning.html" id="detail-back" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <span class="tool-topbar__title">Détails du cours</span>
      <span style="width: 38px;"></span>
    </header>

    <main class="course-detail" id="course-detail">
      <img class="course-detail__photo" id="detail-photo" src="assets/img/studio-reformer.jpg" alt="" />

      <div class="course-detail__body">
        <h1 id="detail-name">—</h1>
        <p class="course-detail__desc" id="detail-desc"></p>

        <div class="detail-info">
          <div class="detail-info__row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span id="detail-date"></span>
          </div>
          <div class="detail-info__row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>
            <span id="detail-time"></span>
          </div>
          <div class="detail-info__row" id="detail-level-row" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
            <span id="detail-level"></span>
          </div>
          <div class="detail-info__row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 12.3L12.7 20.2a2 2 0 0 1-2.8 0l-7-7a2 2 0 0 1 0-2.8l7.9-7.9a2 2 0 0 1 1.5-.6l6 .1a2 2 0 0 1 2 2l.1 6a2 2 0 0 1-.6 1.5z"/><circle cx="14" cy="7" r="1.2"/></svg>
            <span>Studio Pause Pilates, 57 chemin de la Speck, Colmar</span>
          </div>
        </div>

        <div class="detail-price">
          <span>Tarif indicatif (cours à l'unité)</span>
          <strong>20 €</strong>
        </div>

        <a class="reserve-cta" href="https://member-app.deciplus.pro/pausepilates/home">
          <span>Réserver ce cours</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>
        </a>

        <div class="detail-note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <span>Vous serez redirigé vers l'espace de réservation sécurisé Pause Pilates pour choisir et confirmer ce créneau.</span>
        </div>
      </div>
    </main>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/capacitor-bridge.js"></script>
    <script src="assets/js/course-detail.js"></script>
  </body>
</html>
