name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  playwright:
    name: Tests de l'app (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installe les dépendances
        run: npm ci

      - name: Installe Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Lance la suite de tests
        run: npm test

      - name: Publie le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
